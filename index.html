<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akilan | UI Developer | Web Designer</title>
    <link rel="stylesheet" href="./assets/css/custom.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>

<body class="bg-black overflow-hidden w-screen h-screen">

    <!-- NAV -->
    <nav class="fixed top-0 left-0 right-0 z-50 ">
        <div class="flex justify-between items-center max-w-[1440px] mx-auto px-6 py-6">
            <img src="./assets/images/logo.png" alt="logo" class="max-w-full w-[80px] md:w-[120px]">
            <div class="flex flex-col gap-1.5 cursor-pointer">
                <span class="block w-6 h-px bg-white rounded"></span>
                <span class="block w-6 h-px bg-white rounded"></span>
                <span class="block w-4 h-px bg-white rounded self-end"></span>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="relative w-screen h-screen flex flex-col justify-center items-center overflow-hidden">
        <!-- Pulsing glow circle (custom: radial-gradient + positioned animation) -->
        <div class="absolute z-[11] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 ">
            <div
                class="w-[250px] md:w-[350px] lg:w-[450px] h-[250px] md:h-[350px] lg:h-[450px] bg-[radial-gradient(circle_at_50%_42%,#e8e8e8_0%,#c0c0c0_30%,#7ab8cc_70%,transparent_100%)] rounded-full animate-pulse-circle">
            </div>
            <img src="./assets/images/hero.png" alt="hero"
                class=" max-w-full absolute left-[4%] -bottom-[33%] z-20 pointer-events-none select-none animate-fade-up">

        </div>
        <!-- <div
                class="absolute z-[11] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] h-[450px] bg-[radial-gradient(circle_at_50%_42%,#e8e8e8_0%,#c0c0c0_30%,#7ab8cc_70%,transparent_100%)] rounded-full animate-pulse-circle">
            </div> -->



        <!-- Scrolling ticker (custom: clamp font-size) -->
        <div class="absolute top-1/2 -translate-y-1/2 z-10 pointer-events-none overflow-hidden w-full">
            <div class="flex whitespace-nowrap animate-ticker font-bebas"
                style="font-size: clamp(80px, 12vw, 160px); letter-spacing: 0.02em;">
                <span class="text-sky-300 pr-4">AKILAN</span>
                <span class="text-white pr-4">WEB DESINGER</span>
                <span class="px-10"></span>
                <span class="text-sky-300 pr-4">AKILAN</span>
                <span class="text-white pr-4">UI DEVELOPER</span>
                <span class="px-10"></span>
                <span class="text-sky-300 pr-4">AKILAN</span>
                <span class="text-white pr-4">FRONTEND DEVELOPER</span>
                <!-- duplicate for seamless loop -->
                <span class="text-sky-300 pr-4">AKILAN</span>
                <span class="text-white pr-4">WEB DESINGER</span>
                <span class="px-10"></span>
                <span class="text-sky-300 pr-4">AKILAN</span>
                <span class="text-white pr-4">UI DEVELOPER</span>
                <span class="px-10"></span>
                <span class="text-sky-300 pr-4">AKILAN</span>
                <span class="text-white pr-4">FRONTEND DEVELOPER</span>
            </div>
        </div>

        <!-- Vignette overlay (custom: radial-gradient) -->
        <div class="absolute inset-0 z-30 pointer-events-none"
            style="background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);">
        </div>

        <!-- Pills (custom: animation-delay per pill) -->
        <div class="absolute z-40 flex justify-center flex-wrap gap-3 px-6 bottom-[4%] sm:bottom-[7%]">
            <div class="animate-fade-up px-4 sm:px-7 py-1.5 sm:py-2.5 rounded-full border border-white/15 bg-white/[0.07] text-white/70 text-sm tracking-wide backdrop-blur-sm cursor-default hover:bg-white/[0.15] hover:text-white hover:border-white/30 transition-all duration-300"
                style="animation-delay:0.44s; opacity:0;">HTML</div>
            <div class="animate-fade-up px-4 sm:px-7 py-1.5 sm:py-2.5 rounded-full border border-white/15 bg-white/[0.07] text-white/70 text-sm tracking-wide backdrop-blur-sm cursor-default hover:bg-white/[0.15] hover:text-white hover:border-white/30 transition-all duration-300"
                style="animation-delay:0.58s; opacity:0;">CSS</div>
            <div class="animate-fade-up px-4 sm:px-7 py-1.5 sm:py-2.5 rounded-full border border-white/15 bg-white/[0.07] text-white/70 text-sm tracking-wide backdrop-blur-sm cursor-default hover:bg-white/[0.15] hover:text-white hover:border-white/30 transition-all duration-300"
                style="animation-delay:0.72s; opacity:0;">TAILWIND CSS</div>
            <div class="animate-fade-up px-4 sm:px-7 py-1.5 sm:py-2.5 rounded-full border border-white/15 bg-white/[0.07] text-white/70 text-sm tracking-wide backdrop-blur-sm cursor-default hover:bg-white/[0.15] hover:text-white hover:border-white/30 transition-all duration-300"
                style="animation-delay:0.72s; opacity:0;">BOOTSTRAP</div>
            <div class="animate-fade-up px-4 sm:px-7 py-1.5 sm:py-2.5 rounded-full border border-white/15 bg-white/[0.07] text-white/70 text-sm tracking-wide backdrop-blur-sm cursor-default hover:bg-white/[0.15] hover:text-white hover:border-white/30 transition-all duration-300"
                style="animation-delay:0.72s; opacity:0;">JS</div>
            <div class="animate-fade-up px-4 sm:px-7 py-1.5 sm:py-2.5 rounded-full border border-white/15 bg-white/[0.07] text-white/70 text-sm tracking-wide backdrop-blur-sm cursor-default hover:bg-white/[0.15] hover:text-white hover:border-white/30 transition-all duration-300"
                style="animation-delay:0.72s; opacity:0;">REACT</div>
            <div class="animate-fade-up px-4 sm:px-7 py-1.5 sm:py-2.5 rounded-full border border-white/15 bg-white/[0.07] text-white/70 text-sm tracking-wide backdrop-blur-sm cursor-default hover:bg-white/[0.15] hover:text-white hover:border-white/30 transition-all duration-300"
                style="animation-delay:0.72s; opacity:0;">GITHUB</div>
            <div class="animate-fade-up px-4 sm:px-7 py-1.5 sm:py-2.5 rounded-full border border-white/15 bg-white/[0.07] text-white/70 text-sm tracking-wide backdrop-blur-sm cursor-default hover:bg-white/[0.15] hover:text-white hover:border-white/30 transition-all duration-300"
                style="animation-delay:0.72s; opacity:0;">FIGMA</div>
        </div>
    </section>

</body>

</html>
